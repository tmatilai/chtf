name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency: release

jobs:
  # A release commit sets CHTF_VERSION to a version without the -dev suffix
  check:
    # Only run on the main repo
    if: github.repository == 'tmatilai/chtf'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for an unreleased version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk -F\' '/^CHTF_VERSION=/ {print $2; exit}' chtf/chtf.sh)"
          if [[ "$version" == *-dev ]]; then
              echo "Development version $version, nothing to release"
          elif [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: $version" >&2
              exit 1
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
              echo "Tag v$version already exists"
          else
              echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires manual approval before the release is created
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v heading="## $VERSION /" '
              index($0, heading) == 1 { found = 1; next }
              /^## / { found = 0 }
              found
          ' CHANGELOG.md)"
          if ! grep -q '[^[:space:]]' <<< "$notes"; then
              echo "No changelog entry for $VERSION" >&2
              exit 1
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes "$notes" --target "$GITHUB_SHA"

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          owner: ${{ github.repository_owner }}
          repositories: homebrew-terraforms

      - name: Trigger the Homebrew tap update
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          jq -n --arg version "$VERSION" \
            '{event_type: "chtf-release", client_payload: {version: $version}}' |
            gh api "repos/$GITHUB_REPOSITORY_OWNER/homebrew-terraforms/dispatches" --input -

  bump:
    needs: [check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app token makes CI run on the PR; GITHUB_TOKEN does not trigger workflows
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Committed through the API so that GitHub signs it, and as a PR
      # because master requires the status checks
      - name: Bump version for development
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          next="$(awk -F. '{print $1 "." $2 "." $3 + 1}' <<< "$VERSION")"
          script/bump "$next"
          branch='next-dev-cycle'
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --silent -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg oid "$GITHUB_SHA" \
            --rawfile sh chtf/chtf.sh \
            --rawfile fish chtf/chtf.fish \
            --rawfile changelog CHANGELOG.md \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: "Bump version for development"},
                fileChanges: {additions: [
                  {path: "chtf/chtf.sh", contents: ($sh | @base64)},
                  {path: "chtf/chtf.fish", contents: ($fish | @base64)},
                  {path: "CHANGELOG.md", contents: ($changelog | @base64)}
                ]}
              }}
            }' > bump.json
          gh api graphql --silent --input bump.json
          gh pr create --base master --head "$branch" \
            --title "Bump version for development" \
            --body "Bump to $next-dev after releasing v$VERSION."
          gh pr merge --auto --squash "$branch"
